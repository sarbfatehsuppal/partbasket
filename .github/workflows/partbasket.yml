name: PartBasket CI and container release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile the optimizer and run the test suite
        run: docker build --target test .

  publish:
    name: Publish release image
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the versioned image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" .
          printf 'PARTBASKET_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Publish to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$PARTBASKET_IMAGE"
